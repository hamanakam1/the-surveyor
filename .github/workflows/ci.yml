name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Byte-compile
        run: python -m compileall -q src tests

  smoke:
    name: real scan · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Survey the runner (read-only)
        run: |
          surveyor --store "$RUNNER_TEMP/ledger" scan --scanners host --no-save --json
          surveyor --store "$RUNNER_TEMP/ledger" scan --scanners host,network --output "$RUNNER_TEMP/plat.oet.json"
          surveyor validate "$RUNNER_TEMP/plat.oet.json"
      - name: Verify ledger chain
        run: |
          surveyor --store "$RUNNER_TEMP/ledger" verify
