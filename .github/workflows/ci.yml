name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run before it. Without this, a burst of commits
# queues a run per commit, and the oldest -- the least interesting -- is the
# one that finishes last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy src
      - name: The committed schema matches the model
        run: |
          python scripts/make_schema.py
          git diff --exit-code -- schema/

  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          # The version axis is about the code, which is the same on every
          # platform; the platform axis is about the parsers, which are not.
          # The full version range runs on Linux, and macOS runs the oldest
          # and the newest, so the macOS runners -- which are the scarce
          # ones -- carry a third of the load.
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest --junitxml=test-results.xml
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
      - name: Coverage floor
        run: python -m pytest --cov=surveyor --cov-report=term-missing
      - name: Byte-compile
        run: python -m compileall -q src tests

  smoke:
    name: real scan · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Survey the runner (read-only)
        run: |
          surveyor --store "$RUNNER_TEMP/ledger" scan --scanners host --no-save --json
          surveyor --store "$RUNNER_TEMP/ledger" scan --scanners host,network --output "$RUNNER_TEMP/plat.oet.json"
          surveyor validate "$RUNNER_TEMP/plat.oet.json"
      - name: The whole survey must be a valid plat
        run: |
          surveyor --store "$RUNNER_TEMP/ledger" scan --output "$RUNNER_TEMP/full.oet.json"
          surveyor validate "$RUNNER_TEMP/full.oet.json"
      - name: Verify ledger chain
        run: |
          surveyor --store "$RUNNER_TEMP/ledger" verify
