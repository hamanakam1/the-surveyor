name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish, e.g. v1.1.0"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: The tag and the package agree
        env:
          # GITHUB_REF_NAME and INPUT_TAG are workflow contexts, not shell
          # variables: reading them from the environment keeps the tag out of
          # the generated source, so a tag can never be injected into it.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ.get("RELEASE_TAG", "").strip()
          if not tag:
              sys.exit("no tag to publish")
          # The version is declared once, in the package. Reading it from
          # there keeps the tag, the CLI and the distribution metadata from
          # drifting apart.
          version = re.search(
              r'^__version__\s*=\s*"([^"]+)"',
              pathlib.Path("src/surveyor/__init__.py").read_text(),
              re.MULTILINE,
          ).group(1)
          expected = tag[1:] if tag.startswith("v") else tag
          if version != expected:
              sys.exit(f"the package says {version}, the tag says {expected}")
          print(f"publishing {version}")
          PY

      - name: The suite still passes
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Build
        run: python -m build

      - name: Check the distribution
        run: twine check dist/*

      - name: Publish to PyPI
        id: publish
        # Publishing needs a trusted publisher configured on PyPI for this
        # repository. Until that exists, the step fails; the GitHub release
        # must still be made, because that is where the notes and the
        # artifacts live.
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Say so when the package did not reach PyPI
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning::The package was not published to PyPI."
          echo "Configure a trusted publisher for this repository:"
          echo "  https://pypi.org/manage/account/publishing/"
          echo "then re-run this workflow with the same tag."

      - name: The release notes for this version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ.get("RELEASE_TAG", "").strip()
          version = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          body = section.group(0).strip() if section else ""
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(body[:400])
          PY

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-notes.md
          # The built distributions ride along with the release. PyPI may not
          # be configured yet, and a release nobody can install is a
          # release nobody uses.
          files: dist/*
