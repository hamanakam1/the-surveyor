name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Lint and types are fast and platform-independent, so they run on their own
# workflow and are not held up behind the macOS test matrix.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy src
      - name: The committed schema matches the model
        run: |
          python scripts/make_schema.py
          git diff --exit-code -- schema/
