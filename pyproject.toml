[project]
name = "the-surveyor"
version = "1.0.0"
description = "The Surveyor - a read-only, local-first systems analyst that surveys real hardware into an Open Edge Topology (OET) map, diffs the map, and narrates what changed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Hamanaka" }]
keywords = ["oet", "topology", "infrastructure", "observability", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Monitoring",
]
# Deliberately zero runtime dependencies: the survey must work on a fresh box,
# offline, with nothing but CPython.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
surveyor = "surveyor.cli:main"

[project.urls]
Homepage = "https://github.com/hamanakam1/the-surveyor"
Issues = "https://github.com/hamanakam1/the-surveyor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surveyor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
